name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install test dependencies
        run: |
          # Pin Ubuntu mirror IPs: GitHub-hosted runner DNS has intermittently failed.
          printf '%s\n' \
            "51.12.153.52 azure.archive.ubuntu.com" \
            "91.189.91.83 archive.ubuntu.com" \
            "185.125.190.81 security.ubuntu.com" | sudo tee -a /etc/hosts >/dev/null
          timeout 300 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-dbus python3-cairo python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0 \
            xvfb dbus-x11 desktop-file-utils appstream
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Byte-compile
        run: python3 -m compileall -q rawm_control
      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate data/io.github.rawmcontrol.RawmControl.desktop
          appstreamcli validate --no-net data/io.github.rawmcontrol.RawmControl.metainfo.xml
      - name: Headless UI smoke test and quit
        run: |
          timeout 45 dbus-run-session -- xvfb-run -a bash -c '
            python3 -m rawm_control --demo --no-tray >/tmp/ui.log 2>&1 &
            pid=$!
            for i in $(seq 1 20); do
              if gdbus call --session                   --dest io.github.rawmcontrol.RawmControl                   --object-path /io/github/rawmcontrol/RawmControl                   --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            for i in $(seq 1 20); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              cat /tmp/ui.log
              echo "UI did not quit cleanly" >&2
              exit 1
            fi
            wait "$pid"
          '
          cat /tmp/ui.log
