name: Edge builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version
        id: version
        run: |
          VERSION=$(python3 -c "from rawm_control.config import VERSION; print(VERSION)")
          echo "value=${VERSION}.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build AppImage
        run: ./packaging/appimage/build.sh "${{ steps.version.outputs.value }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: edge-appimage
          path: dist/*.AppImage

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version
        id: version
        run: |
          VERSION=$(python3 -c "from rawm_control.config import VERSION; print(VERSION)")
          echo "value=${VERSION}.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Install Flatpak tooling
        run: |
          # Pin Ubuntu mirror IPs: GitHub-hosted runner DNS has intermittently failed.
          printf '%s\n' \
            "51.12.153.52 azure.archive.ubuntu.com" \
            "91.189.91.83 archive.ubuntu.com" \
            "185.125.190.81 security.ubuntu.com" | sudo tee -a /etc/hosts >/dev/null
          timeout 300 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          timeout 480 sudo flatpak install -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build Flatpak
        run: ./packaging/flatpak/build.sh "${{ steps.version.outputs.value }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: edge-flatpak
          path: dist/*.flatpak

  edge:
    needs: [appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view edge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create edge --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Edge builds" \
              --notes "Automated builds from main. Not a stable release."
          fi
          gh release upload edge dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release view edge --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
